<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traveller - Плануй подорожі</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
    .app { display: flex; height: 100vh; }

    .sidebar {
      width: 440px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      z-index: 10;
    }
    .sidebar-header { padding: 1.25rem; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #3b82f6; }
    .logo span { color: #94a3b8; font-weight: 400; font-size: 0.875rem; margin-left: 0.5rem; }

    .search-box { position: relative; margin-top: 1rem; }
    .search-box input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 1rem;
    }
    .search-box input:focus { outline: none; border-color: #3b82f6; }
    .search-box input::placeholder { color: #64748b; }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      margin-top: 4px;
      z-index: 1000;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }
    .suggestion { padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .suggestion:hover { background: #334155; }
    .suggestion:last-child { border-bottom: none; }

    .search-controls { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .search-controls input {
      width: 80px;
      padding: 0.5rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      text-align: center;
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: #3b82f6; color: white; flex: 1; }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: #475569; cursor: not-allowed; }

    .categories-section {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #334155;
      max-height: 100px;
      overflow-y: auto;
    }
    .categories-title { font-size: 0.7rem; color: #64748b; margin-bottom: 0.5rem; text-transform: uppercase; }
    .categories { display: flex; flex-wrap: wrap; gap: 0.375rem; }
    .cat-chip {
      padding: 0.25rem 0.5rem;
      background: #334155;
      border: none;
      border-radius: 12px;
      color: #94a3b8;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .cat-chip:hover { background: #475569; }
    .cat-chip.selected { background: #3b82f6; color: white; }

    /* Filter section */
    .filter-section {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #334155;
      display: none;
    }
    .filter-section.visible { display: block; }
    .filter-input {
      width: 100%;
      padding: 0.6rem 0.875rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
    }
    .filter-input:focus { outline: none; border-color: #3b82f6; }

    .results-section { flex: 1; overflow-y: auto; padding: 1rem; padding-bottom: 100px; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
    .results-count { color: #94a3b8; font-size: 0.8rem; }

    .poi-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .poi-card {
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      transition: all 0.2s;
      cursor: pointer;
    }
    .poi-card:hover { border-color: #3b82f6; }
    .poi-card.selected { border-color: #10b981; background: #0f2a1f; }
    .poi-card.hidden { display: none; }

    .poi-image {
      height: 100px;
      background-size: cover;
      background-position: center;
      position: relative;
      background-color: #334155;
    }
    .poi-image-placeholder {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      position: relative;
    }
    .poi-image-placeholder.cat-museum { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
    .poi-image-placeholder.cat-attraction { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .poi-image-placeholder.cat-viewpoint { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
    .poi-image-placeholder.cat-park { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .poi-image-placeholder.cat-beach { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .poi-image-placeholder.cat-historic { background: linear-gradient(135deg, #a78bfa, #8b5cf6); }
    .poi-image-placeholder.cat-climbing { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .poi-image-placeholder.cat-diving { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .poi-image-placeholder.cat-surfing { background: linear-gradient(135deg, #14b8a6, #0d9488); }
    .poi-image-placeholder.cat-default { background: linear-gradient(135deg, #64748b, #475569); }
    .poi-category-badge {
      position: absolute;
      top: 0.5rem; left: 0.5rem;
      background: rgba(0,0,0,0.75);
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
    }
    .poi-add-btn {
      position: absolute;
      top: 0.5rem; right: 0.5rem;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.95);
      color: #1e293b;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .poi-add-btn:hover { background: #10b981; color: white; transform: scale(1.1); }
    .poi-add-btn.added { background: #10b981; color: white; }

    .poi-content { padding: 0.75rem; }
    .poi-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.25rem; color: #f1f5f9; }
    .poi-description {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .poi-meta { display: flex; align-items: center; gap: 0.75rem; font-size: 0.7rem; color: #64748b; }
    .poi-rating { display: flex; align-items: center; gap: 0.2rem; color: #fbbf24; }

    .map-container { flex: 1; position: relative; }
    #map { height: 100%; width: 100%; }

    /* Fixed Trip Panel at bottom of sidebar */
    .trip-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 440px;
      background: #1e293b;
      padding: 1rem 1.25rem;
      border-top: 1px solid #334155;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    }
    .trip-panel.visible { transform: translateY(0); }
    .trip-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .trip-info h3 { font-size: 1rem; margin-bottom: 0.125rem; }
    .trip-info p { font-size: 0.75rem; color: #94a3b8; }
    .btn-plan {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-plan:hover { opacity: 0.9; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .modal-overlay.visible { opacity: 1; visibility: visible; }
    .modal {
      background: #1e293b;
      border-radius: 16px;
      width: 95%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #334155;
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 { font-size: 1.2rem; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
    .modal-body { padding: 1.5rem; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
    .form-row { display: flex; gap: 1rem; }
    .form-row .form-group { flex: 1; }
    .form-input {
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1rem;
    }
    .form-input:focus { outline: none; border-color: #3b82f6; }

    .intensity-options { display: flex; gap: 0.5rem; }
    .intensity-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      color: #94a3b8;
      cursor: pointer;
      text-align: center;
    }
    .intensity-btn:hover { border-color: #3b82f6; }
    .intensity-btn.selected { background: #1e3a5f; color: #3b82f6; border-color: #3b82f6; }
    .intensity-btn .emoji { font-size: 1.5rem; display: block; margin-bottom: 0.25rem; }
    .intensity-btn small { display: block; font-size: 0.65rem; opacity: 0.7; }

    .warning-box {
      background: #451a03;
      border: 1px solid #92400e;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .warning-box.visible { display: block; }
    .warning-box h4 { color: #fbbf24; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .warning-box p { font-size: 0.8rem; color: #fcd34d; }
    .suggested-remove { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .remove-chip {
      padding: 0.25rem 0.6rem;
      background: #78350f;
      border: none;
      border-radius: 6px;
      color: #fcd34d;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .remove-chip:hover { background: #92400e; }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid #334155;
      display: flex;
      gap: 1rem;
    }
    .modal-footer .btn { flex: 1; padding: 0.875rem; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }

    .route-result { padding: 1.5rem; }
    .route-day { margin-bottom: 1.25rem; }
    .route-day-header {
      font-weight: 600;
      color: #3b82f6;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #334155;
    }
    .route-stop { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.5rem 0; }
    .route-stop-number {
      width: 24px; height: 24px;
      background: #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .route-stop-info h4 { font-size: 0.85rem; margin-bottom: 0.125rem; }
    .route-stop-info p { font-size: 0.7rem; color: #64748b; }

    .status-message { text-align: center; padding: 3rem 1rem; color: #64748b; }
    .status-message.loading::after {
      content: '';
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; height: 55vh; }
      .map-container { height: 45vh; }
      .trip-panel { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Traveller <span>beta</span></div>
        <div class="search-box">
          <input type="text" id="city-search" placeholder="🔍 Пошук міста (Paris, Rio...)">
          <div id="suggestions" class="suggestions"></div>
        </div>
        <div class="search-controls">
          <input type="number" id="radius" value="5" min="1" max="50" title="Радіус (км)">
          <button class="btn btn-primary" id="explore-btn" disabled>Знайти місця</button>
        </div>
      </div>

      <div class="categories-section">
        <div class="categories-title">Категорії</div>
        <div class="categories" id="categories"></div>
      </div>

      <div class="filter-section" id="filter-section">
        <input type="text" class="filter-input" id="poi-filter" placeholder="🔎 Фільтр по назві місця...">
      </div>

      <div class="results-section" id="results-section">
        <div class="status-message">Введіть назву міста та оберіть категорії</div>
      </div>

      <div class="trip-panel" id="trip-panel">
        <div class="trip-summary">
          <div class="trip-info">
            <h3>✨ Обрано <span id="selected-count">0</span> місць</h3>
            <p id="trip-hint">Натисніть для створення маршруту</p>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn-plan" id="view-route-btn" style="display: none; background: #10b981; padding: 0.75rem;">🗺️</button>
            <button class="btn-plan" id="plan-btn">🗺️ Планувати</button>
          </div>
        </div>
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <div class="modal-overlay" id="plan-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>🗓️ Планування подорожі</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="warning-box" id="warning-box">
          <h4>⚠️ Забагато місць!</h4>
          <p>Обрано більше місць, ніж вміститься у подорож. Рекомендуємо прибрати:</p>
          <div class="suggested-remove" id="suggested-remove"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Кількість днів</label>
            <input type="number" class="form-input" id="trip-days" value="3" min="1" max="14">
          </div>
          <div class="form-group">
            <label>Місць на день</label>
            <input type="number" class="form-input" id="places-per-day" value="4" min="2" max="8" readonly>
          </div>
        </div>
        <div class="form-group">
          <label>Насиченість подорожі</label>
          <div class="intensity-options">
            <button class="intensity-btn" data-intensity="relaxed" data-places="3">
              <span class="emoji">😌</span>Спокійна<small>2-3 місця/день</small>
            </button>
            <button class="intensity-btn selected" data-intensity="moderate" data-places="4">
              <span class="emoji">🚶</span>Помірна<small>4-5 місць/день</small>
            </button>
            <button class="intensity-btn" data-intensity="intense" data-places="6">
              <span class="emoji">🏃</span>Насичена<small>6-8 місць/день</small>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Де ви зупиняєтесь?</label>
          <input type="text" class="form-input" id="accommodation" placeholder="Готель або адреса">
          <div id="accommodation-suggestions" class="suggestions"></div>
        </div>
      </div>
      <div class="route-result" id="route-result" style="display: none;"></div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Скасувати</button>
        <button class="btn btn-success" id="generate-route">✨ Створити маршрут</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let selectedLocation = null;
    let selectedCategories = new Set(['attraction', 'museum', 'viewpoint']);
    let pois = [];
    let selectedPois = new Set();
    let markers = [];
    let accommodationLocation = null;
    let map;
    let generatedRoute = null;
    let routeStartPoint = null;

    const categoryIcons = {
      museum: '🏛️', attraction: '⭐', viewpoint: '👁️', gallery: '🖼️',
      historic: '🏰', religious: '⛪', park: '🌳', beach: '🏖️',
      nature_reserve: '🌲', waterfall: '💧', peak: '⛰️', cave: '🕳️',
      climbing: '🧗', diving: '🤿', surfing: '🏄', kitesurfing: '🪁',
      paragliding: '🪂', skydiving: '🪂', bungee: '🎢', rafting: '🚣',
      kayak: '🛶', skiing: '⛷️', mountain_biking: '🚵', zip_line: '🎿',
      restaurant: '🍽️', cafe: '☕', bar: '🍺', market: '🛒',
      theatre: '🎭', cinema: '🎬', zoo: '🦁', aquarium: '🐠',
      theme_park: '🎢', nightclub: '🎉', swimming: '🏊', stadium: '🏟️',
      golf: '⛳', hotel: '🏨', hostel: '🛏️', camping: '⛺'
    };

    const defaultImages = {
      museum: 'https://images.unsplash.com/photo-1554907984-15263bfd63bd?w=400&h=200&fit=crop',
      attraction: 'https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=400&h=200&fit=crop',
      viewpoint: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=200&fit=crop',
      park: 'https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=400&h=200&fit=crop',
      beach: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&h=200&fit=crop',
      historic: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&h=200&fit=crop',
      default: 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=400&h=200&fit=crop'
    };

    // Init map
    map = L.map('map').setView([48.85, 2.35], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    // Load categories
    fetch('/api/osm/categories').then(r => r.json()).then(categories => {
      const container = document.getElementById('categories');
      categories.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = 'cat-chip' + (selectedCategories.has(cat) ? ' selected' : '');
        chip.textContent = `${categoryIcons[cat] || '📍'} ${cat.replace(/_/g, ' ')}`;
        chip.onclick = () => {
          selectedCategories.has(cat) ? selectedCategories.delete(cat) : selectedCategories.add(cat);
          chip.classList.toggle('selected');
          updateExploreButton();
        };
        container.appendChild(chip);
      });
    });

    // City search
    let searchTimeout;
    const searchInput = document.getElementById('city-search');
    const suggestionsEl = document.getElementById('suggestions');

    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const q = e.target.value.trim();
      if (q.length < 2) { suggestionsEl.style.display = 'none'; return; }
      searchTimeout = setTimeout(async () => {
        const results = await fetch(`/api/geocode/search?q=${encodeURIComponent(q)}&limit=5`).then(r => r.json());
        if (!results.length) { suggestionsEl.style.display = 'none'; return; }
        suggestionsEl.innerHTML = results.map(r => `
          <div class="suggestion" data-lat="${r.lat}" data-lng="${r.lng}" data-name="${r.display_name}">${r.display_name}</div>
        `).join('');
        suggestionsEl.style.display = 'block';
      }, 300);
    });

    suggestionsEl.addEventListener('click', (e) => {
      const s = e.target.closest('.suggestion');
      if (!s) return;
      selectedLocation = { lat: parseFloat(s.dataset.lat), lng: parseFloat(s.dataset.lng), name: s.dataset.name };
      searchInput.value = s.dataset.name.split(',')[0];
      suggestionsEl.style.display = 'none';
      map.setView([selectedLocation.lat, selectedLocation.lng], 13);
      updateExploreButton();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) suggestionsEl.style.display = 'none';
      if (!e.target.closest('#accommodation') && !e.target.closest('#accommodation-suggestions')) {
        document.getElementById('accommodation-suggestions').style.display = 'none';
      }
    });

    function updateExploreButton() {
      document.getElementById('explore-btn').disabled = !selectedLocation || selectedCategories.size === 0;
    }

    // Explore
    document.getElementById('explore-btn').addEventListener('click', explorePOIs);

    async function explorePOIs() {
      const btn = document.getElementById('explore-btn');
      const results = document.getElementById('results-section');
      const radius = parseInt(document.getElementById('radius').value) || 5;

      btn.disabled = true;
      results.innerHTML = '<div class="status-message loading">Шукаємо цікаві місця</div>';
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      pois = [];
      selectedPois.clear();
      updateTripPanel();

      try {
        const response = await fetch('/api/osm/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            center: { lat: selectedLocation.lat, lng: selectedLocation.lng },
            radius_km: radius,
            categories: Array.from(selectedCategories),
            limit: 150
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);
        pois = data.pois;

        // Try to load Wikipedia images for POIs with wikidata
        await loadWikipediaImages();

        if (!pois.length) {
          results.innerHTML = '<div class="status-message">Нічого не знайдено. Спробуйте інші категорії.</div>';
          document.getElementById('filter-section').classList.remove('visible');
          return;
        }

        document.getElementById('filter-section').classList.add('visible');
        document.getElementById('poi-filter').value = '';
        renderPOIs();
        renderMarkers();
      } catch (error) {
        results.innerHTML = `<div class="status-message" style="color:#f87171;">Помилка: ${error.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    // Load Wikipedia images
    async function loadWikipediaImages() {
      const poisWithWikidata = pois.filter(p => p.raw_tags?.wikidata);
      if (!poisWithWikidata.length) return;

      const wikiIds = poisWithWikidata.map(p => p.raw_tags.wikidata).slice(0, 50);
      try {
        const url = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${wikiIds.join('|')}&props=claims&format=json&origin=*`;
        const response = await fetch(url);
        const data = await response.json();

        for (const poi of poisWithWikidata) {
          const entity = data.entities?.[poi.raw_tags.wikidata];
          const imageClaim = entity?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
          if (imageClaim) {
            const filename = imageClaim.replace(/ /g, '_');
            const hash = md5(filename);
            poi.imageUrl = `https://upload.wikimedia.org/wikipedia/commons/thumb/${hash[0]}/${hash[0]}${hash[1]}/${filename}/400px-${filename}`;
          }
        }
      } catch (e) {
        console.log('Could not load Wikipedia images:', e);
      }
    }

    // Simple MD5 hash for Wikimedia URLs
    function md5(string) {
      function rotateLeft(value, shift) { return (value << shift) | (value >>> (32 - shift)); }
      function addUnsigned(x, y) {
        const x8 = x & 0x80000000, y8 = y & 0x80000000, x4 = x & 0x40000000, y4 = y & 0x40000000;
        const result = (x & 0x3FFFFFFF) + (y & 0x3FFFFFFF);
        if (x4 & y4) return result ^ 0x80000000 ^ x8 ^ y8;
        if (x4 | y4) { if (result & 0x40000000) return result ^ 0xC0000000 ^ x8 ^ y8; else return result ^ 0x40000000 ^ x8 ^ y8; }
        return result ^ x8 ^ y8;
      }
      function f(x, y, z) { return (x & y) | (~x & z); }
      function g(x, y, z) { return (x & z) | (y & ~z); }
      function h(x, y, z) { return x ^ y ^ z; }
      function i(x, y, z) { return y ^ (x | ~z); }
      function ff(a, b, c, d, x, s, ac) { a = addUnsigned(a, addUnsigned(addUnsigned(f(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
      function gg(a, b, c, d, x, s, ac) { a = addUnsigned(a, addUnsigned(addUnsigned(g(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }

      function convertToWordArray(string) {

        a=ff(a,b,c,d,x[k+4],S11,0xF57C0FAF);d=ff(d,a,b,c,x[k+5],S12,0x4787C62A);c=ff(c,d,a,b,x[k+6],S13,0xA8304613);b=ff(b,c,d,a,x[k+7],S14,0xFD469501);
        a=ff(a,b,c,d,x[k+8],S11,0x698098D8);d=ff(d,a,b,c,x[k+9],S12,0x8B44F7AF);c=ff(c,d,a,b,x[k+10],S13,0xFFFF5BB1);b=ff(b,c,d,a,x[k+11],S14,0x895CD7BE);
        a=ff(a,b,c,d,x[k+12],S11,0x6B901122);d=ff(d,a,b,c,x[k+13],S12,0xFD987193);c=ff(c,d,a,b,x[k+14],S13,0xA679438E);b=ff(b,c,d,a,x[k+15],S14,0x49B40821);
        a=gg(a,b,c,d,x[k+1],S21,0xF61E2562);d=gg(d,a,b,c,x[k+6],S22,0xC040B340);c=gg(c,d,a,b,x[k+11],S23,0x265E5A51);b=gg(b,c,d,a,x[k+0],S24,0xE9B6C7AA);

        a=hh(a,b,c,d,x[k+1],S31,0xA4BEEA44);d=hh(d,a,b,c,x[k+4],S32,0x4BDECFA9);c=hh(c,d,a,b,x[k+7],S33,0xF6BB4B60);b=hh(b,c,d,a,x[k+10],S34,0xBEBFBC70);
        a=hh(a,b,c,d,x[k+13],S31,0x289B7EC6);d=hh(d,a,b,c,x[k+0],S32,0xEAA127FA);c=hh(c,d,a,b,x[k+3],S33,0xD4EF3085);b=hh(b,c,d,a,x[k+6],S34,0x4881D05);
        a=hh(a,b,c,d,x[k+9],S31,0xD9D4D039);d=hh(d,a,b,c,x[k+12],S32,0xE6DB99E5);c=hh(c,d,a,b,x[k+15],S33,0x1FA27CF8);b=hh(b,c,d,a,x[k+2],S34,0xC4AC5665);

        a=ii(a,b,c,d,x[k+8],S41,0x6FA87E4F);d=ii(d,a,b,c,x[k+15],S42,0xFE2CE6E0);c=ii(c,d,a,b,x[k+6],S43,0xA3014314);b=ii(b,c,d,a,x[k+13],S44,0x4E0811A1);
        a=ii(a,b,c,d,x[k+4],S41,0xF7537E82);d=ii(d,a,b,c,x[k+11],S42,0xBD3AF235);c=ii(c,d,a,b,x[k+2],S43,0x2AD7D2BB);b=ii(b,c,d,a,x[k+9],S44,0xEB86D391);

    }

    // Filter POIs
    document.getElementById('poi-filter').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.poi-card').forEach(card => {
        const name = card.querySelector('.poi-name').textContent.toLowerCase();
        card.classList.toggle('hidden', query && !name.includes(query));
      });
    });

    // Render POIs
    function renderPOIs() {
      const results = document.getElementById('results-section');
      results.innerHTML = `
        <div class="results-header">
          <span class="results-count">Знайдено ${pois.length} місць</span>
        </div>
        <div class="poi-grid">${pois.map((poi, i) => renderPOICard(poi, i)).join('')}</div>
      `;
      results.querySelectorAll('.poi-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.poi-add-btn')) return;
          const idx = parseInt(card.dataset.index);
          markers[idx]?.openPopup();
          map.setView([pois[idx].lat, pois[idx].lng], 16);
        });
      });
      results.querySelectorAll('.poi-add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePOI(parseInt(btn.dataset.index));
        });
      });
    }

    function generateDescription(poi) {
      const tags = poi.raw_tags || {};
      const parts = [];

      // Check for explicit description
      if (tags.description) return tags.description;
      if (tags['description:uk']) return tags['description:uk'];
      if (tags['description:en']) return tags['description:en'];

      // Build description from tags
      if (tags.cuisine) parts.push(`Кухня: ${tags.cuisine.replace(/;/g, ', ')}`);
      if (tags.fee === 'yes') parts.push('💰 Платний вхід');
      else if (tags.fee === 'no') parts.push('🆓 Безкоштовно');
      if (tags.wheelchair === 'yes') parts.push('♿ Доступно');
      if (tags.internet_access === 'wlan' || tags.internet_access === 'yes') parts.push('📶 Wi-Fi');
      if (tags.outdoor_seating === 'yes') parts.push('🌤️ Тераса');
      if (tags.historic) parts.push(`Історичне: ${tags.historic.replace(/_/g, ' ')}`);
      if (tags.sport) parts.push(`Спорт: ${tags.sport.replace(/_/g, ' ')}`);
      if (tags.building && !['yes', 'commercial'].includes(tags.building)) parts.push(`${tags.building.replace(/_/g, ' ')}`);
      if (tags.artwork_type) parts.push(`Арт: ${tags.artwork_type.replace(/_/g, ' ')}`);
      if (tags.stars) parts.push(`${'⭐'.repeat(Math.min(parseInt(tags.stars), 5))}`);

      if (parts.length) return parts.join(' • ');

      // Default: category description
      const categoryDescriptions = {
        museum: 'Музей з експозиціями та колекціями',
        attraction: 'Популярна туристична пам\'ятка',
        viewpoint: 'Оглядовий майданчик з чудовим видом',
        park: 'Парк для відпочинку та прогулянок',
        beach: 'Пляж для відпочинку біля води',
        historic: 'Історична пам\'ятка',
        climbing: 'Місце для скелелазіння',
        diving: 'Точка для дайвінгу',
        surfing: 'Спот для серфінгу',
        paragliding: 'Місце для парапланеризму',
        restaurant: 'Ресторан з різноманітним меню',
        cafe: 'Кафе для перекусу та кави',
        gallery: 'Галерея мистецтв'
      };
      return categoryDescriptions[poi.category] || `${categoryIcons[poi.category] || '📍'} Цікаве місце`;
    }

    function renderPOICard(poi, index) {
      const isSelected = selectedPois.has(index);
      const hasImage = !!poi.imageUrl;
      const desc = generateDescription(poi);
      const catClass = ['museum','attraction','viewpoint','park','beach','historic','climbing','diving','surfing'].includes(poi.category) ? `cat-${poi.category}` : 'cat-default';

      const imageHtml = hasImage
        ? `<div class="poi-image" style="background-image: url('${poi.imageUrl}')">
            <span class="poi-category-badge">${categoryIcons[poi.category] || '📍'} ${poi.category.replace(/_/g, ' ')}</span>
            <button class="poi-add-btn ${isSelected ? 'added' : ''}" data-index="${index}">${isSelected ? '✓' : '+'}</button>
          </div>`
        : `<div class="poi-image-placeholder ${catClass}">
            <span style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">${categoryIcons[poi.category] || '📍'}</span>
            <span class="poi-category-badge">${poi.category.replace(/_/g, ' ')}</span>
            <button class="poi-add-btn ${isSelected ? 'added' : ''}" data-index="${index}">${isSelected ? '✓' : '+'}</button>
          </div>`;

      return `
        <div class="poi-card ${isSelected ? 'selected' : ''}" data-index="${index}">
          ${imageHtml}
          <div class="poi-content">
            <div class="poi-name">${poi.name}</div>
            <div class="poi-description">${desc}</div>
            <div class="poi-meta">
              ${hasImage ? '<span style="color:#10b981;">📸</span>' : ''}
              ${poi.opening_hours ? `<span>🕐 ${poi.opening_hours.split(';')[0]}</span>` : ''}
              ${poi.website ? '<span>🔗</span>' : ''}
              ${poi.raw_tags?.phone ? '<span>📞</span>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    function togglePOI(index) {
      selectedPois.has(index) ? selectedPois.delete(index) : selectedPois.add(index);
      const card = document.querySelector(`.poi-card[data-index="${index}"]`);
      const btn = card?.querySelector('.poi-add-btn');
      if (card) card.classList.toggle('selected');
      if (btn) { btn.classList.toggle('added'); btn.textContent = selectedPois.has(index) ? '✓' : '+'; }
      updateTripPanel();
    }

    function renderMarkers() {
      pois.forEach((poi, i) => {
        const marker = L.marker([poi.lat, poi.lng]).addTo(map)
          .bindPopup(`<b>${poi.name}</b><br>${categoryIcons[poi.category] || ''} ${poi.category}`);
        markers.push(marker);
      });
      if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.1));
    }

    function updateTripPanel() {
      document.getElementById('selected-count').textContent = selectedPois.size;
      document.getElementById('trip-panel').classList.toggle('visible', selectedPois.size > 0 || generatedRoute);
      const viewRouteBtn = document.getElementById('view-route-btn');
      const tripHint = document.getElementById('trip-hint');
      if (generatedRoute) {
        viewRouteBtn.style.display = 'block';
        tripHint.textContent = 'Маршрут готовий! Переглянути на карті';
      } else {
        viewRouteBtn.style.display = 'none';
        tripHint.textContent = 'Натисніть для створення маршруту';
      }
    }

    // Modal
    const modal = document.getElementById('plan-modal');
    document.getElementById('plan-btn').addEventListener('click', () => { modal.classList.add('visible'); checkCapacity(); });
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('view-route-btn').addEventListener('click', () => {
      if (generatedRoute && routeStartPoint) {
        drawRouteOnMap(generatedRoute, routeStartPoint);
      }
    });

    function closeModal() {
      modal.classList.remove('visible');
      document.getElementById('route-result').style.display = 'none';
      document.getElementById('modal-body').style.display = 'block';
      document.getElementById('modal-footer').style.display = 'flex';
    }

    document.querySelectorAll('.intensity-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.intensity-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('places-per-day').value = btn.dataset.places;
        checkCapacity();
      });
    });

    document.getElementById('trip-days').addEventListener('input', checkCapacity);

    function checkCapacity() {
      const days = parseInt(document.getElementById('trip-days').value) || 1;
      const perDay = parseInt(document.getElementById('places-per-day').value) || 4;
      const capacity = days * perDay;
      const warning = document.getElementById('warning-box');
      const suggestRemove = document.getElementById('suggested-remove');

      if (selectedPois.size > capacity) {
        warning.classList.add('visible');
        const toRemove = selectedPois.size - capacity;

        // Calculate scores for each selected POI (higher = worse, should be removed first)
        // Score based on: distance from center + lack of photo
        const centerPoint = accommodationLocation || selectedLocation || { lat: 0, lng: 0 };
        const selectedWithScores = Array.from(selectedPois).map(idx => {
          const poi = pois[idx];
          if (!poi) return { idx, score: 0 };

          // Distance score (0-10 range normalized)
          const distance = haversine(centerPoint.lat, centerPoint.lng, poi.lat, poi.lng);

          // Photo penalty: places without photos get +2 score (more likely to remove)
          const photoScore = poi.imageUrl ? 0 : 2;

          // No wikidata penalty
          const wikidataScore = poi.raw_tags?.wikidata ? 0 : 1;

          return { idx, score: distance + photoScore + wikidataScore, distance, name: poi.name };
        });

        // Sort by score descending (highest score = remove first)
        selectedWithScores.sort((a, b) => b.score - a.score);

        const suggestions = selectedWithScores.slice(0, toRemove);

        suggestRemove.innerHTML = suggestions.map(item => {
          const reason = item.distance > 3 ? `📍 ${item.distance.toFixed(1)}км` : '📷 без фото';
          return `<button class="remove-chip" data-index="${item.idx}" title="${reason}">✕ ${pois[item.idx]?.name?.substring(0, 12) || 'місце'}... <small style="opacity:0.7">${reason}</small></button>`;
        }).join('');

        suggestRemove.querySelectorAll('.remove-chip').forEach(chip => {
          chip.addEventListener('click', () => { togglePOI(parseInt(chip.dataset.index)); checkCapacity(); });
        });
      } else {
        warning.classList.remove('visible');
      }
    }

    // Accommodation
    const accInput = document.getElementById('accommodation');
    const accSuggestions = document.getElementById('accommodation-suggestions');
    let accTimeout;
    accInput.addEventListener('input', (e) => {
      clearTimeout(accTimeout);
      const q = e.target.value.trim();
      if (q.length < 2) { accSuggestions.style.display = 'none'; return; }
      accTimeout = setTimeout(async () => {
        const results = await fetch(`/api/geocode/search?q=${encodeURIComponent(q)}&limit=5`).then(r => r.json());
        if (!results.length) { accSuggestions.style.display = 'none'; return; }
        accSuggestions.innerHTML = results.map(r => `
          <div class="suggestion" data-lat="${r.lat}" data-lng="${r.lng}" data-name="${r.display_name}">${r.display_name}</div>
        `).join('');
        accSuggestions.style.display = 'block';
      }, 300);
    });
    accSuggestions.addEventListener('click', (e) => {
      const s = e.target.closest('.suggestion');
      if (!s) return;
      accommodationLocation = { lat: parseFloat(s.dataset.lat), lng: parseFloat(s.dataset.lng) };
      accInput.value = s.dataset.name.split(',')[0];
      accSuggestions.style.display = 'none';
    });

    // Generate route
    document.getElementById('generate-route').addEventListener('click', generateRoute);

    function generateRoute() {
      const days = parseInt(document.getElementById('trip-days').value) || 1;
      const perDay = parseInt(document.getElementById('places-per-day').value) || 4;
      const selectedList = Array.from(selectedPois).map(i => pois[i]).filter(Boolean);
      const startPoint = accommodationLocation || selectedLocation;

      if (!selectedList.length || !startPoint) return;

      const route = optimizeRoute(selectedList, startPoint, days, perDay);

      // Save route for later viewing
      generatedRoute = route;
      routeStartPoint = startPoint;

      document.getElementById('modal-body').style.display = 'none';
      document.getElementById('modal-footer').style.display = 'none';
      const routeResult = document.getElementById('route-result');
      routeResult.style.display = 'block';

      routeResult.innerHTML = `
        <h3 style="margin-bottom:1rem;">🎉 Ваш маршрут готовий!</h3>
        ${route.map((dayPois, dayIdx) => `
          <div class="route-day">
            <div class="route-day-header">📅 День ${dayIdx + 1} (${dayPois.length} місць)</div>
            ${dayPois.map((poi, stopIdx) => `
              <div class="route-stop">
                <div class="route-stop-number">${stopIdx + 1}</div>
                <div class="route-stop-info">
                  <h4>${categoryIcons[poi.category] || ''} ${poi.name}</h4>
                  <p>${poi.category.replace(/_/g, ' ')}</p>
                </div>
              </div>
            `).join('')}
          </div>
        `).join('')}
        <button class="btn btn-primary" style="width:100%;margin-top:1rem;" onclick="closeModal()">Закрити</button>
      `;

      drawRouteOnMap(route, startPoint);
      updateTripPanel();
    }

    function optimizeRoute(places, start, days, perDay) {
      if (places.length === 0) return [];

      const hasAccommodation = !!accommodationLocation;

      // Step 1: Cluster POIs geographically into days using k-means
      const clusters = kMeansCluster(places, days);

      // Step 2: Sort clusters by distance from start point (closest cluster = day 1)
      const startPoint = hasAccommodation ? start : {
        lat: places.reduce((s, p) => s + p.lat, 0) / places.length,
        lng: places.reduce((s, p) => s + p.lng, 0) / places.length
      };

      clusters.sort((a, b) => {
        const centroidA = getClusterCentroid(a);
        const centroidB = getClusterCentroid(b);
        return haversine(startPoint.lat, startPoint.lng, centroidA.lat, centroidA.lng) -
               haversine(startPoint.lat, startPoint.lng, centroidB.lat, centroidB.lng);
      });

      // Step 3: Within each cluster, optimize order using nearest neighbor
      const route = clusters.map((cluster, dayIdx) => {
        if (cluster.length === 0) return [];

        // Start point for this day's route
        let current;
        if (hasAccommodation) {
          current = start;
        } else if (dayIdx === 0) {
          // First day without accommodation: start from POI closest to cluster centroid
          const centroid = getClusterCentroid(cluster);
          let nearestIdx = 0, minDist = Infinity;
          cluster.forEach((poi, idx) => {
            const dist = haversine(centroid.lat, centroid.lng, poi.lat, poi.lng);
            if (dist < minDist) { minDist = dist; nearestIdx = idx; }
          });
          const firstPoi = cluster.splice(nearestIdx, 1)[0];
          current = { lat: firstPoi.lat, lng: firstPoi.lng };
          const orderedDay = [firstPoi];
          // Continue with remaining POIs
          while (cluster.length > 0) {
            let nearestIdx = 0, nearestDist = Infinity;
            cluster.forEach((poi, idx) => {
              const dist = haversine(current.lat, current.lng, poi.lat, poi.lng);
              if (dist < nearestDist) { nearestDist = dist; nearestIdx = idx; }
            });
            const next = cluster.splice(nearestIdx, 1)[0];
            orderedDay.push(next);
            current = { lat: next.lat, lng: next.lng };
          }
          return orderedDay;
        } else {
          // Subsequent days: start from last POI of previous day
          const prevDay = route[dayIdx - 1];
          const lastPoi = prevDay[prevDay.length - 1];
          current = { lat: lastPoi.lat, lng: lastPoi.lng };
        }

        // Order POIs in cluster using nearest neighbor
        const remaining = [...cluster];
        const orderedDay = [];
        while (remaining.length > 0) {
          let nearestIdx = 0, nearestDist = Infinity;
          remaining.forEach((poi, idx) => {
            const dist = haversine(current.lat, current.lng, poi.lat, poi.lng);
            if (dist < nearestDist) { nearestDist = dist; nearestIdx = idx; }
          });
          const next = remaining.splice(nearestIdx, 1)[0];
          orderedDay.push(next);
          current = { lat: next.lat, lng: next.lng };
        }
        return orderedDay;
      });

      return route.filter(day => day.length > 0);
    }

    // K-means clustering
    function kMeansCluster(points, k) {
      if (points.length <= k) {
        return points.map(p => [p]);
      }

      // Initialize centroids using k-means++ method
      const centroids = [];
      centroids.push({ lat: points[0].lat, lng: points[0].lng });

      while (centroids.length < k) {
        const distances = points.map(p => {
          const minDist = Math.min(...centroids.map(c => haversine(p.lat, p.lng, c.lat, c.lng)));
          return minDist * minDist;
        });
        const totalDist = distances.reduce((a, b) => a + b, 0);
        let random = Math.random() * totalDist;
        for (let i = 0; i < points.length; i++) {
          random -= distances[i];
          if (random <= 0) {
            centroids.push({ lat: points[i].lat, lng: points[i].lng });
            break;
          }
        }
      }

      // Iterate k-means
      let clusters;
      for (let iter = 0; iter < 10; iter++) {
        // Assign points to nearest centroid
        clusters = Array.from({ length: k }, () => []);
        points.forEach(p => {
          let nearestIdx = 0, minDist = Infinity;
          centroids.forEach((c, idx) => {
            const dist = haversine(p.lat, p.lng, c.lat, c.lng);
            if (dist < minDist) { minDist = dist; nearestIdx = idx; }
          });
          clusters[nearestIdx].push(p);
        });

        // Update centroids
        clusters.forEach((cluster, idx) => {
          if (cluster.length > 0) {
            centroids[idx] = {
              lat: cluster.reduce((s, p) => s + p.lat, 0) / cluster.length,
              lng: cluster.reduce((s, p) => s + p.lng, 0) / cluster.length
            };
          }
        });
      }

      return clusters;
    }

    function getClusterCentroid(cluster) {
      if (cluster.length === 0) return { lat: 0, lng: 0 };
      return {
        lat: cluster.reduce((s, p) => s + p.lat, 0) / cluster.length,
        lng: cluster.reduce((s, p) => s + p.lng, 0) / cluster.length
      };
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    let routeLines = [];
    let accommodationMarker = null;
    const dayColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6'];

    function drawRouteOnMap(route, start) {
      routeLines.forEach(l => map.removeLayer(l));
      routeLines = [];
      if (accommodationMarker) map.removeLayer(accommodationMarker);

      // Add accommodation marker if user specified where they stay
      if (accommodationLocation) {
        accommodationMarker = L.marker([accommodationLocation.lat, accommodationLocation.lng], {
          icon: L.divIcon({
            className: 'accommodation-marker',
            html: '<div style="background:#10b981;color:white;padding:4px 8px;border-radius:8px;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.3);">🏠 Готель</div>',
            iconSize: [80, 30],
            iconAnchor: [40, 15]
          })
        }).addTo(map);
      }

      route.forEach((dayPois, dayIdx) => {
        let points;
        if (accommodationLocation) {
          // If accommodation set: home -> POIs -> home
          points = [[start.lat, start.lng], ...dayPois.map(p => [p.lat, p.lng]), [start.lat, start.lng]];
        } else {
          // If no accommodation: just connect POIs to each other
          points = dayPois.map(p => [p.lat, p.lng]);
        }

        if (points.length > 1) {
          const line = L.polyline(points, { color: dayColors[dayIdx % dayColors.length], weight: 4, opacity: 0.8 }).addTo(map);
          routeLines.push(line);
        }
      });

      const allPoints = route.flat().map(p => [p.lat, p.lng]);
      if (accommodationLocation) allPoints.push([accommodationLocation.lat, accommodationLocation.lng]);
      if (allPoints.length > 1) map.fitBounds(allPoints);
    }
  </script>
